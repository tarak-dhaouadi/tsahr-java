name: release

# Builds tsahr-java.jar and attaches it to a GitHub Release.
#
# Easiest way to publish a release (no need to use the GitHub "Releases" form first):
#     git tag v0.1.1
#     git push origin v0.1.1
# Pushing a tag that starts with "v" builds the JAR, creates the GitHub Release if it does not exist yet
# (notes are taken from CHANGELOG.md) and attaches tsahr-java.jar to it.
#
# Other ways to start it:
#   * Publishing a release in the GitHub web UI also runs this workflow (the tag must be created
#     AFTER release.yaml was committed, otherwise the tagged commit does not contain the workflow).
#   * For a tag/release that already exists (e.g. one made before this file was added): go to
#     Actions -> release -> Run workflow, and type the tag name (e.g. v0.1.1). This always works,
#     because it uses the workflow from the branch you select and builds the source of that tag.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the JAR to (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write   # needed to create the release and upload the JAR

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    name: Build tsahr-java.jar and attach it to the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      # Builds out/tsahr-java.jar (JDK only, no dependencies) and runs the engine parity and regression tests.
      # The JAR is not released if a test fails.
      - name: Build and test
        run: bash ./build.sh test

      - name: Check the tag matches the application version
        run: |
          APP_VERSION=$(grep -oP 'VERSION = "\K[^"]+' src/main/java/org/tsahr/cli/Main.java || true)
          TAG_VERSION="${TAG#v}"
          echo "Tag: ${TAG} | application version: ${APP_VERSION}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::warning::Tag '${TAG}' does not match Main.VERSION '${APP_VERSION}' (also check pom.xml and CITATION.cff)."
          fi

      - name: Smoke-test the JAR
        run: java -jar out/tsahr-java.jar --help

      - name: Create the release if it does not exist, then attach the JAR
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            VERSION="${TAG#v}"
            # release notes = the matching section of CHANGELOG.md, if there is one
            awk -v v="$VERSION" '
              /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md || true
            if [ -s release-notes.md ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "tsahr-java $VERSION" --notes-file release-notes.md
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "tsahr-java $VERSION" --generate-notes
            fi
          fi
          gh release upload "$TAG" out/tsahr-java.jar --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached tsahr-java.jar to release ${TAG}"
