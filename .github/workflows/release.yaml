name: release

# Builds tsahr-java.jar and attaches it to a GitHub Release.
#
# How to publish a release:
#   1. On GitHub: Releases -> "Draft a new release" -> create a tag such as v0.1.1 -> "Publish release".
#   2. This workflow starts automatically and uploads tsahr-java.jar to that release (usually within a minute).
#
# To (re)build the JAR for an existing release, run this workflow manually (Actions -> release -> Run workflow)
# and enter the tag name.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the JAR to (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write   # needed to upload the JAR to the release

jobs:
  build-and-attach:
    name: Build tsahr-java.jar and attach it to the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      # Builds out/tsahr-java.jar (JDK only, no dependencies) and runs the engine parity and regression tests.
      # The JAR is not released if a test fails.
      - name: Build and test
        run: bash ./build.sh test

      - name: Check the tag matches the application version
        run: |
          APP_VERSION=$(grep -oP 'VERSION = "\K[^"]+' src/main/java/org/tsahr/cli/Main.java)
          TAG_VERSION="${TAG#v}"
          echo "Tag: ${TAG} | application version: ${APP_VERSION}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::warning::Tag '${TAG}' does not match Main.VERSION '${APP_VERSION}' (also check pom.xml and CITATION.cff)."
          fi

      - name: Smoke-test the JAR
        run: java -jar out/tsahr-java.jar --help

      - name: Attach tsahr-java.jar to the release
        run: gh release upload "$TAG" out/tsahr-java.jar --clobber --repo "$GITHUB_REPOSITORY"
